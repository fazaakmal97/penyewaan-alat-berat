services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: alat_berat
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_DATABASE: alat_berat
      DB_USERNAME: root
      DB_PASSWORD: secret
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mysql
    volumes:
      - ./backend:/var/www/html

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mysql_data:
